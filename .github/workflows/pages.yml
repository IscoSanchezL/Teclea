name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Registra las ilustraciones que subiste a assets/img (reemplazan los placeholders solas)
      - name: Generar manifiesto de ilustraciones
        run: node tools/generar-manifest-assets.mjs
      # Lista de archivos para el modo sin conexión (service worker) + versión para actualizar los dispositivos
      - name: Generar precaché (modo sin conexión)
        run: node tools/generar-precache.mjs
      - uses: actions/configure-pages@v5
      # Solo se publica lo que la web necesita (sin pruebas, herramientas ni documentos)
      - name: Preparar carpeta de publicación
        run: |
          mkdir _site
          cp -r index.html configurar.html manifest.webmanifest sw.js precache.json css js data assets _site/
          cp -r docs _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
