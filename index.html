  <!-- Aplica el tema guardado ANTES de pintar (evita el parpadeo claro/oscuro) -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('teclea:prefs') || '{}'), r = document.documentElement;
        var oscuro = p.tema === 'oscuro' || ((!p.tema || p.tema === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        r.dataset.theme = oscuro ? 'dark' : 'light';
        if (p.texto) r.dataset.textsize = p.texto;
        if (p.fuente) r.dataset.font = p.fuente;
        if (p.daltonico) r.dataset.colorblind = 'on';
        if (p.movimiento === 'reducido' || matchMedia('(prefers-reduced-motion: reduce)').matches) r.dataset.motion = 'reducido';
      } catch (e) { /* sin almacenamiento: se usan los valores por defecto */ }
    })();
  </script>
